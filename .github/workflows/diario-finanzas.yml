# Produce y programa cada madrugada el contenido de HOY de Plata con Datos.
# Sustituye a tareas/diario_finanzas.bat: corre en GitHub, sin el PC encendido.
#
# El estado que el diario necesita recordar entre noches (qué se programó,
# qué temas se usaron, qué clips ya salieron) se guarda haciendo commit en
# este mismo repo al terminar. Los videos NO se guardan en git: quedan como
# artefacto descargable del run durante 7 días.
name: Diario · finanzas

on:
  schedule:
    # 08:00 UTC = 03:00 en Bogotá: justo después de que se renueva la cuota
    # diaria gratuita de Gemini (medianoche del Pacífico), así cada día
    # arranca con las 20 peticiones enteras. Quedan unas 4 horas de margen
    # antes del primer short (07:30) por si GitHub retrasa el cron.
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      fecha:
        description: "Día a preparar (AAAA-MM-DD). Vacío = hoy en Bogotá."
        required: false
        default: ""
      simular:
        description: "Producir todo pero no subir ni programar nada"
        type: boolean
        default: false

# Dos ejecuciones a la vez se pisarían el calendario y la base de datos.
concurrency:
  group: diario-finanzas
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  diario:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PYTHONIOENCODING: utf-8
      ENCODER: cpu
      GUIONISTA: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
      FACEBOOK_PAGE_TOKEN: ${{ secrets.FACEBOOK_PAGE_TOKEN }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: FFmpeg y fuentes libres
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto-core fonts-dejavu-core fonts-liberation

      - name: Dependencias
        run: pip install -r requirements.txt

      - name: Credenciales de YouTube
        env:
          CLIENT_SECRETS: ${{ secrets.YOUTUBE_CLIENT_SECRETS_FINANZAS }}
          TOKEN: ${{ secrets.YOUTUBE_TOKEN_FINANZAS }}
        run: |
          # Sin token, el diario salta YouTube con aviso y sigue con Facebook.
          [ -n "$CLIENT_SECRETS" ] && printf '%s' "$CLIENT_SECRETS" > nichos/finanzas/client_secrets.json
          [ -n "$TOKEN" ] && printf '%s' "$TOKEN" > nichos/finanzas/youtube_token.json
          python cli.py doctor

      - name: Producir y programar
        env:
          FECHA: ${{ inputs.fecha }}
          SIMULAR: ${{ inputs.simular }}
        run: |
          # El diario prepara "mañana" por defecto; a las 03:00 toca el mismo día.
          [ -z "$FECHA" ] && FECHA=$(TZ=America/Bogota date +%F)
          args="--fecha $FECHA"
          [ "$SIMULAR" = "true" ] && args="$args --simular"
          python cli.py diario finanzas $args

      - name: Guardar el estado en el repo
        # También si hubo fallos: lo que sí se programó tiene que quedar anotado
        # para no duplicarlo al relanzar. En simulación no se guarda nada.
        if: always() && inputs.simular != true
        run: |
          git config user.name "diario-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for ruta in estudio.db cache/registro \
                      nichos/finanzas/calendario.jsonl nichos/finanzas/temas.json \
                      nichos/finanzas/guiones nichos/finanzas/output/posts/historial.jsonl; do
            [ -e "$ruta" ] && git add -f "$ruta"
          done
          if git diff --cached --quiet; then
            echo "Sin cambios de estado."
            exit 0
          fi
          git commit -m "Diario finanzas: estado del $(date -u +%F)"
          git pull --rebase
          git push

      - name: Videos e imágenes producidos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: finanzas-${{ github.run_id }}
          path: |
            nichos/finanzas/output/shorts/*.mp4
            nichos/finanzas/output/largos/*.mp4
            nichos/finanzas/output/posts/*.png
          retention-days: 7
          if-no-files-found: ignore
